apiVersion: v2
name: arr-stack
description: Helm umbrella chart for the arr-stack self-hosted media stack
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"

# ⚠️ app-template bumps are NOT safe to automerge (renovate.json pins <5.1.0).
# The 14 aliases all resolve to the committed vendored dir charts/app-template/.
# Renovate edits this file + Chart.lock but does NOT regenerate that dir → a bare
# version bump makes Chart.lock ≠ vendored dir → chart renders 6/59 resources
# (caused a data loss 2026-08-28: ArgoCD prune deleted the PVCs). To bump app-template:
#   1. edit versions here, then: helm dependency update charts/arr-stack/
#   2. unpack: tar -xzf charts/arr-stack/charts/app-template-*.tgz -C charts/arr-stack/charts/
#   3. VERIFY: helm template charts/arr-stack -f examples/values-prod.yaml | grep -c '^kind:'  → must be 59
#   4. commit Chart.yaml + Chart.lock + the regenerated charts/app-template/ together
dependencies:
  - name: app-template
    alias: sonarr
    version: 5.0.1
    repository: https://bjw-s-labs.github.io/helm-charts
  - name: app-template
    alias: radarr
